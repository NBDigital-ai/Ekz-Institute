<svg xmlns="http://www.w3.org/2000/svg">
  <!-- Iconos hechos con las piezas del logo. Uso: <svg class="ico"><use href="assets/icons.svg#ico-maestro"/></svg>
       menu.js los inyecta en la página para que las pupilas sigan el cursor y las partes se animen. -->
  <symbol id="ico-maestro" viewBox="0 0 40 40">
    <rect width="40" height="40" rx="7" fill="#E8231D"/>
    <circle class="ico-eye" cx="20" cy="20" r="11" fill="#fff"/>
    <circle class="ico-pupil" cx="20" cy="20" r="5"/>
  </symbol>
  <symbol id="ico-alumno" viewBox="0 0 40 40">
    <rect width="40" height="40" rx="7" fill="#1BA8E0"/>
    <circle class="ico-eye" cx="20" cy="20" r="11" fill="#fff"/>
    <circle class="ico-pupil" cx="20" cy="20" r="5"/>
  </symbol>
  <symbol id="ico-padres" viewBox="0 0 40 40">
    <rect width="40" height="40" rx="7" fill="#F5C400"/>
    <g class="ico-lashes" stroke="#000" stroke-width="2.5" stroke-linecap="round"><line x1="13" y1="12" x2="11" y2="7"/><line x1="20" y1="10" x2="20" y2="5"/><line x1="27" y1="12" x2="29" y2="7"/></g>
    <circle class="ico-eye" cx="20" cy="24" r="10" fill="#fff"/>
    <circle class="ico-pupil" cx="20" cy="24" r="4.5"/>
  </symbol>
  <symbol id="ico-ojo" viewBox="0 0 40 40">
    <circle class="ico-eye" cx="20" cy="20" r="15" fill="#fff" stroke="#1F2B4D" stroke-width="3"/>
    <circle class="ico-pupil" cx="20" cy="20" r="6"/>
  </symbol>
  <symbol id="ico-boca" viewBox="0 0 40 40">
    <path class="ico-lip" d="M4 17 Q20 38 36 17 Q20 22 4 17Z" fill="#fff" stroke="#E8231D" stroke-width="3.5" stroke-linejoin="round"/>
    <path class="ico-teeth" d="M10 18.5 l3 5 3-5 3 5 3-5 3 5 3-5 3 5 3-5" fill="#1F2B4D"/>
  </symbol>
</svg>
